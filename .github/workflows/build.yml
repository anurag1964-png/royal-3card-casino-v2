name: Build Release APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Set Version Code 20800 & Build APK
        run: |
          sed -i 's/versionCode 1/versionCode 20800/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.8"/g' android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal3CardCasino-v2.8-APK
          path: android/app/build/outputs/apk/release/*.apk
