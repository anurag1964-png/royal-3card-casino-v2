name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Inject Native Unity Ads & Amazon IAP SDKs
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 20800/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.8"/g' android/app/build.gradle
          sed -i '/dependencies {/a \    implementation "com.unity3d.ads:unity-ads:4.12.2"\n    implementation "com.amazon.device:amazon-appstore-sdk:3.0.4"' android/app/build.gradle
          cat << 'EOF' > android/app/src/main/java/com/playzonestudios/royal3cardcasino3d/MainActivity.java
          package com.playzonestudios.royal3cardcasino3d;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;
          import com.amazon.device.iap.PurchasingListener;
          import com.amazon.device.iap.PurchasingService;
          import com.amazon.device.iap.model.ProductDataResponse;
          import com.amazon.device.iap.model.PurchaseResponse;
          import com.amazon.device.iap.model.PurchaseUpdatesResponse;
          import com.amazon.device.iap.model.UserDataResponse;
          import com.amazon.device.iap.model.FulfillmentResult;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends BridgeActivity {
              private static final String UNITY_GAME_ID = "5789421";
              private static final String PLACEMENT_ID = "Rewarded_Android";
              private boolean adReady = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  UnityAds.initialize(this, UNITY_GAME_ID, false, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {
                          loadRewardedAd();
                      }

                      @Override
                      public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {}
                  });

                  PurchasingService.registerListener(this, new PurchasingListener() {
                      @Override
                      public void onUserDataResponse(UserDataResponse response) {}

                      @Override
                      public void onProductDataResponse(ProductDataResponse response) {}

                      @Override
                      public void onPurchaseResponse(PurchaseResponse response) {
                          if (response.getRequestStatus() == PurchaseResponse.RequestStatus.SUCCESSFUL) {
                              String sku = response.getReceipt().getSku();
                              PurchasingService.notifyFulfillment(response.getReceipt().getReceiptId(), FulfillmentResult.FULFILLED);
                              runOnUiThread(() -> bridge.getWebView().evaluateJavascript("window.onNativePurchaseSuccess('" + sku + "');", null));
                          }
                      }

                      @Override
                      public void onPurchaseUpdatesResponse(PurchaseUpdatesResponse response) {}
                  });

                  Set<String> skus = new HashSet<>();
                  skus.add("coins_1000");
                  skus.add("coins_5000");
                  skus.add("coins_25000");
                  skus.add("remove_ads");
                  PurchasingService.getProductData(skus);

                  bridge.getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void showRewardedAd() {
                          runOnUiThread(() -> {
                              if (adReady) {
                                  UnityAds.show(MainActivity.this, PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                      @Override
                                      public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                          loadRewardedAd();
                                      }

                                      @Override
                                      public void onUnityAdsShowStart(String placementId) {}

                                      @Override
                                      public void onUnityAdsShowClick(String placementId) {}

                                      @Override
                                      public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                          if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                              runOnUiThread(() -> bridge.getWebView().evaluateJavascript("window.onNativeAdRewarded();", null));
                                          }
                                          loadRewardedAd();
                                      }
                                  });
                              } else {
                                  loadRewardedAd();
                              }
                          });
                      }

                      @JavascriptInterface
                      public void purchaseSku(String sku) {
                          PurchasingService.purchase(sku);
                      }
                  }, "NativeBridge");
              }

              private void loadRewardedAd() {
                  adReady = false;
                  UnityAds.load(PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          adReady = true;
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          adReady = false;
                      }
                  });
              }
          }
          EOF
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal3CardCasino-v2.8-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
