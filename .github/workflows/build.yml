name: Build Release APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Inject Native Unity Ads & Amazon IAP SDKs
        run: |
         sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 20800/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.8"/g' android/app/build.gradle
          sed -i '/dependencies {/a \    implementation "com.unity3d.ads:unity-ads:4.12.2"\n    implementation "com.amazon.device:amazon-appstore-sdk:3.0.4"' android/app/build.gradle
          cat << 'EOF' > android/app/src/main/java/com/playzonestudios/royal3cardcasino3d/MainActivity.java
          package com.playzonestudios.royal3cardcasino3d;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.amazon.device.iap.PurchasingListener;
          import com.amazon.device.iap.PurchasingService;
          import com.amazon.device.iap.model.*;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends BridgeActivity {
              private static final String UNITY_GAME_ID = "800438848";
              private static final String PLACEMENT_ID = "Rewarded_Android";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, false, new IUnityAdsInitializationListener() {
                      @Override public void onInitializationComplete() { UnityAds.load(PLACEMENT_ID, new IUnityAdsLoadListener() { @Override public void onUnityAdsAdLoaded(String p) {} @Override public void onUnityAdsFailedToLoad(String p, UnityAds.UnityAdsLoadError e, String m) {} }); }
                      @Override public void onInitializationFailed(UnityAds.UnityAdsInitializationError e, String m) {}
                  });

                  PurchasingService.registerListener(this, new PurchasingListener() {
                      @Override public void onUserDataResponse(UserDataResponse r) {}
                      @Override public void onProductDataResponse(ProductDataResponse r) {}
                      @Override public void onPurchaseResponse(PurchaseResponse r) {
                          if (r.getRequestStatus() == PurchaseResponse.RequestStatus.SUCCESSFUL) {
                              Receipt rec = r.getReceipt();
                              PurchasingService.notifyFulfillment(rec.getReceiptId(), FulfillmentResult.FULFILLED);
                              final String sku = rec.getSku();
                              final String rid = rec.getReceiptId();
                              runOnUiThread(() -> bridge.getWebView().evaluateJavascript(
                                  "if(window.onNativeAmazonPurchase)window.onNativeAmazonPurchase('" + sku + "','" + rid + "');", null));
                          }
                      }
                      @Override public void onPurchaseUpdatesResponse(PurchaseUpdatesResponse r) {
                          for (Receipt rec : r.getReceipts()) {
                              if (!rec.isCanceled()) {
                                  PurchasingService.notifyFulfillment(rec.getReceiptId(), FulfillmentResult.FULFILLED);
                                  final String sku = rec.getSku();
                                  final String rid = rec.getReceiptId();
                                  runOnUiThread(() -> bridge.getWebView().evaluateJavascript(
                                      "if(window.onNativeAmazonPurchase)window.onNativeAmazonPurchase('" + sku + "','" + rid + "');", null));
                              }
                          }
                      }
                  });

                  bridge.getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void showRewardedAd() {
                          runOnUiThread(() -> UnityAds.show(MainActivity.this, PLACEMENT_ID, new IUnityAdsShowListener() {
                              @Override public void onUnityAdsShowFailure(String p, UnityAds.UnityAdsShowError e, String m) {}
                              @Override public void onUnityAdsShowStart(String p) {}
                              @Override public void onUnityAdsShowClick(String p) {}
                              @Override public void onUnityAdsShowComplete(String p, UnityAds.UnityAdsShowCompletionState state) {
                                  if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                      runOnUiThread(() -> bridge.getWebView().evaluateJavascript("if(window.onNativeUnityAdComplete)window.onNativeUnityAdComplete();", null));
                                  }
                                  UnityAds.load(PLACEMENT_ID, new IUnityAdsLoadListener() { @Override public void onUnityAdsAdLoaded(String p) {} @Override public void onUnityAdsFailedToLoad(String p, UnityAds.UnityAdsLoadError e, String m) {} });
                              }
                          }));
                      }
                      @JavascriptInterface
                      public void purchaseSku(String sku) {
                          PurchasingService.purchase(sku);
                      }
                  }, "NativeBridge");
              }
          }
          }
          EOF
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal3CardCasino-v2.8-APK
          path: android/app/build/outputs/apk/release/*.apk
